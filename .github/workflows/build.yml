name: Build Aloo Sensi v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Aloo Sensi Pro PRODUCTION APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found in the runner Android SDK at $SDK_ROOT"
            echo "Available SDK folders:"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "Using Android SDK: $SDK_ROOT"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(find . -type f -name settings.gradle -not -path '*/.git/*' -not -path '*/build/*' -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found in the checked-out repository."
            echo "Repository folders (first 200):"
            find . -maxdepth 5 -type d -not -path './.git*' | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle was not found beside $SETTINGS"
            find "$PROJECT_DIR" -maxdepth 4 -type f | head -200
            exit 1
          fi
          echo "Android project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Aloo Sensi Pro PRODUCTION APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --project-dir "$PROJECT_DIR" assembleRelease

      - name: Upload Aloo Sensi v1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aloo-Sensi-Pro-PRODUCTION
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
